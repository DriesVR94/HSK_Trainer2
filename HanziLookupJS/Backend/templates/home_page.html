<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Let's Practice!</title>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@200;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='home_page.css') }}">
</head>

<body>
  <header>
    <nav>
      <div class="logo_bar">
        <img src="{{ url_for('static', filename='images/LogoHSKHero2.png') }}" alt="HSK Hero Logo" class="logo">
        <span class="logo-text">HSK Hero</span>
      </div>

      <div class="nav-links">
        <ul>
          <li><a href="{{ url_for('show_welcome_page') }}">Home</a></li>
          <li><a href="#">About HSK</a></li>
          <li><a href="#">FAQ</a></li>
          <li><a href="#">Profile</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <!-- Toggle Buttons -->
    <div class="hsk-toggle-container">
      <button class="toggle-btn active" id="btnHSK2">HSK 2.0</button>
      <button class="toggle-btn" id="btnHSK3">HSK 3.0</button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- HSK 2.0 Section -->
    <section class="HSK2_0">
      <h2 class="header_selected_levels_currentHSK">HSK 2.0 - Current Version</h2>
      <ol>
        <li>Level 1</li>
        <li>Level 2</li>
        <li>Level 3</li>
        <li>Level 4</li>
        <li>Level 5</li>
        <li>Level 6</li>
      </ol>
    </section>

    <!-- HSK 3.0 Section -->
    <section class="HSK3_0">
      <h2 class="header_selected_levels_newHSK">HSK 3.0 - New Version</h2>
      <ol>
        <li>Level 1</li>
        <li>Level 2</li>
        <li>Level 3</li>
        <li>Level 4</li>
        <li>Level 5</li>
        <li>Level 6</li>
        <li>Levels 7 - 9</li>
      </ol>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btnHSK2 = document.getElementById("btnHSK2");
      const btnHSK3 = document.getElementById("btnHSK3");
      const hsk2Section = document.querySelector(".HSK2_0");
      const hsk3Section = document.querySelector(".HSK3_0");
      const progressBar = document.getElementById("progressBar");

      // Show HSK 2.0 by default
      showHSK("2.0");

      function showHSK(version) {
        if (version === "2.0") {
          hsk2Section.style.display = "block";
          hsk3Section.style.display = "none";
          btnHSK2.classList.add("active");
          btnHSK3.classList.remove("active");
          updateProgress(6, 6); // Full completion for demo
        } else {
          hsk2Section.style.display = "none";
          hsk3Section.style.display = "block";
          btnHSK2.classList.remove("active");
          btnHSK3.classList.add("active");
          updateProgress(7, 7);
        }
      }

      function updateProgress(completed, total) {
        const percent = (completed / total) * 100;
        progressBar.style.width = percent + "%";
      }

      btnHSK2.addEventListener("click", () => showHSK("2.0"));
      btnHSK3.addEventListener("click", () => showHSK("3.0"));
    });
  </script>
</body>
</html>
