<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HanziLookupJS demo</title>
  <script src="{{ url_for('static', filename='lib/jquery-3.1.1.min.js') }}"></script>
  <script src="{{ url_for('static', filename='dist/hanzilookup.min.js') }}"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #fafafa; font-family: Verdana, sans-serif; padding-top: 70px; }
    div, h1, h2 { position: relative; float: none; box-sizing: border-box; height: auto; overflow: visible; width: 100%; margin: 0 0 10px 0; }
    h1 { margin-bottom: 8px; }  h2 { font-weight: normal; margin-bottom: 8px; }
    .content, .header { width: 100%; margin: 0 auto; background-color: #000f18; padding: 20px; color: #f0f0f0; border-radius: 8px; float: none; }
    .header { text-align: center; margin-bottom: 20px; }  .header a { color: #fce566; text-decoration: none; }
    .colLeft_2 { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
    .colLeft { display: flex; flex-wrap: nowrap; gap: 20px; justify-content: center; width: 810px; margin: 0 auto;}
    .colLeft > .boardWrap { flex: 0 0 auto; }
    .drawing-board { width: 300px; height: 300px; background-color: #fafafa; border: 1px solid #ccc; border-radius: 8px;}
    .commands { width: 100%; margin: 8px; display: flex;  justify-content: center; }
    .cmd { flex: 0.2; background-color: #f1c40f; border-radius: 3px; text-align: center; cursor: default; margin: 8px; padding: 3px; color: #000f18; user-select: none; }
    .cmd:hover { background-color: #f1d7a6; }
    .charPicker { width: 100%; border: 1px solid #a0a0a0; padding: 3%; height: 70px; font-size: 48px; background-color: #fafafa; overflow: hidden; color: #606060; }
    .targetCharBox { width: 500px; height: 100px; padding: 4%; font-weight: bold; font-size: 30px; background-color: #f1c40f; border-radius: 8px; color: #333; margin-top: 10px; font-family: "Noto Sans", "Arial", sans-serif; display: flex;  flex-direction: column; justify-content: center; align-items: center; text-align: center; line-height: 1.2; }
    .colRight { width: 100%; margin-top: 20px; }
    .feedbackBar { display: flex; height: 30px; width: 100%; margin: 8px 0; font-size: 12px; text-align: center;}
    .segment { flex: 1; display: flex; align-items: center; justify-content: center; opacity: 0.2; transition: background-color 0.3s; color: black; }
    .segment.highlight { opacity: 1 !important; border: 2px solid black; font-weight: bold; }
    .noob { background-color: #f79297; color: black; }
    .familiar { background-color: #f4676e; color: black; }
    .good { background-color: #f03d46; color: black; }
    .expert { background-color: #ee1c25; color: black; }
    .feedbackBar.correct { background-color: #a6e3a1; opacity: 1; }
    .feedbackBar.incorrect { background-color: #f28b82; opacity: 1;}
    .ocrResultBox { width: 100%; text-align: center; font-size: 48px; padding: 8px; margin-top: 10px; border-top: 1px dashed #aaa; color: #444; font-family: "Noto Sans", "Arial", sans-serif; }
  </style>
</head>
<body>
  <div class="header">
    <h1>HanziLookupJS demo</h1>
    <a href="https://github.com/gugray/HanziLookupJS">github.com/gugray/HanziLookupJS</a>
  </div>

  <div class="content">
    <div class="colLeft_2">
      <div id="targetWord" class="targetCharBox">loading…</div>
    </div>

    <!-- dynamic boards go here -->
    <div class="colLeft" id="drawingBoardsContainer"></div>
    <div style="text-align: center; margin: 20px 0;">
      <div class="cmd" id="nextButton" style="width: 200px; margin: 10px auto;"><i class="fa-solid fa-angle-right"></i> </div>
    </div>
  </div>



  <script>
    // ====== Asset Loading ======
    let assetsLoaded = false;
    let filesToLoad = 2;

    function fileLoaded(ok) {
      if (!ok) { filesToLoad = -1; return; }
      if (--filesToLoad === 0) {
        assetsLoaded = true;
        maybeInitBoards();
      }
    }


    HanziLookup.init('mmah', '/static/dist/mmah.json', fileLoaded);
    HanziLookup.init('orig', '/static/dist/orig.json', fileLoaded);


    // ====== Load DB Word ======
    function loadHanziFromDatabase() {
      return fetch('/api/get_next_word')
        .then(r => r.json())
        .then(entry => {

          // store data globally
          window.targetCharacter = entry.word;
          window.targetPinyin = entry.pinyin;
          window.targetEnglish = entry.english;

          window.targetHanziEntry = {
            chinese: entry.word,
            charCount: [...entry.word].length,
            strokeCounts: entry.stroke_counts || []
          };

          // Display --> pinyin - english
          const targetBox = document.getElementById('targetWord');
          targetBox.textContent = `${entry.pinyin} - ${entry.english}`;
        });
    }






    // ====== Initialize Boards ======
    function maybeInitBoards() {
      if (!assetsLoaded) return;
      loadHanziFromDatabase().then(() => buildBoards());
    }


    // ====== Build Drawing Boards ======
    function buildBoards() {
      const container = document.getElementById('drawingBoardsContainer');
      container.innerHTML = '';

      const chars = [...window.targetCharacter];

      chars.forEach((char, index) => {
        const boardWrapper = document.createElement('div');
        boardWrapper.className = 'boardWrap';

        // drawing area
        const canvas = document.createElement('canvas');
        canvas.width = 300;
        canvas.height = 300;
        canvas.className = 'drawing-board';
        boardWrapper.appendChild(canvas);

        container.appendChild(boardWrapper);

        // create drawing board
        const board = new HanziLookup.DrawingBoard(canvas, char, {
          showOutline: true,
          maxStrokes: window.targetHanziEntry.strokeCounts[index] || 50,
          onComplete: () => handleCharComplete(char, index, board)
        });
      });
    }


  // ====== Next button ======
  document.getElementById('nextButton').onclick = () => {
    loadHanziFromDatabase().then(() => buildBoards());
  };
  </script>
</body>
</html>
