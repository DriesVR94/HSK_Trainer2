<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@200;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='signin_page.css') }}">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="container" aria-labelledby="signin-title">
    <div class="brand">
      <div>
        <h1 id="signin-title">Sign in to your account</h1>
      </div>
    </div>

    <form id="signinForm" novalidate>
      <div>
        <label for="email">Email</label>
        <input id="email" class="input" name="email" type="email" inputmode="email" placeholder="Enter your email" required aria-required="true">
        <div id="emailError" class="error" aria-live="polite" style="display:none"></div>
      </div>

      <div>
        <label for="password">Password</label>
        <div style="position:relative">
          <input id="password" class="input" name="password" type="password" placeholder="Enter password" minlength="8" required aria-required="true" style="padding-right:96px">
          <button id="togglePwd" type="button" aria-label="Show password" style="position:absolute;right:8px;top:6px;padding:8px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:13px">Show</button>
        </div>
        <div id="pwdError" class="error" aria-live="polite" style="display:none"></div>
      </div>

      <div class="row">
        <label class="checkbox"><input id="remember" type="checkbox"> <span class="small">Remember me</span></label>
        <a href="#" class="small">Forgot password?</a>
      </div>

      <div>
        <button class="btn" type="submit">Sign in</button>
      </div>

      <div class="divider small">Or continue with</div>

      <div class="socials">

        <button id="googleLoginBtn" class="gsi-material-button">
          <div class="gsi-material-button-state"></div>

          <div class="gsi-material-button-content-wrapper">

            <div class="gsi-material-button-icon">
              <svg version="1.1"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 48 48"
                  xmlns:xlink="http://www.w3.org/1999/xlink"
                  style="display:block;">

                <path fill="#EA4335"
                      d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9
                      2.38 30.47 0 24 0 14.62 0 6.51 5.38
                      2.56 13.22l7.98 6.19C12.43 13.72
                      17.74 9.5 24 9.5z"></path>

                <path fill="#4285F4"
                      d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94
                      c-.58 2.96-2.26 5.48-4.78
                      7.18l7.73 6c4.51-4.18
                      7.09-10.36 7.09-17.65z"></path>

                <path fill="#FBBC05"
                      d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59
                      l-7.98-6.19C.92 16.46 0
                      20.12 0 24c0 3.88.92 7.54
                      2.56 10.78l7.97-6.19z"></path>

                <path fill="#34A853"
                      d="M24 48c6.48 0 11.93-2.13
                      15.89-5.81l-7.73-6c-2.15
                      1.45-4.92 2.3-8.16
                      2.3-6.26 0-11.57-4.22-13.47-9.91
                      l-7.98 6.19C6.51 42.62
                      14.62 48 24 48z"></path>

                <path fill="none" d="M0 0h48v48H0z"></path>
              </svg>
            </div>

            <span class="gsi-material-button-contents">
              Continue with Google
            </span>

            <span style="display:none;">
              Continue with Google
            </span>

          </div>
        </button>

      </div>

      <p class="muted" style="margin-top:14px">Don't have an account? <a href="#">Create one</a></p>
    </form>

    <script>
      (function(){
        let googleClient;
        const form = document.getElementById('signinForm');
        const email = document.getElementById('email');
        const pwd = document.getElementById('password');
        const toggle = document.getElementById('togglePwd');
        const emailError = document.getElementById('emailError');
        const pwdError = document.getElementById('pwdError');

        toggle.addEventListener('click', ()=>{
          const isPwd = pwd.type === 'password';
          pwd.type = isPwd ? 'text' : 'password';
          toggle.textContent = isPwd ? 'Hide' : 'Show';
          toggle.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
        });

        googleClient = google.accounts.oauth2.initTokenClient({
          client_id: "365777418021-krre441oq3u1rjv89vis4qkj592io06t.apps.googleusercontent.com",

          scope: "email profile openid",

          callback: async (response) => {

            try {

              const res = await fetch("/auth/google", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(response)
              });

              const data = await res.json();

              if (data.success) {
                window.location.href = "/home_page";
              } else {
                alert("Google sign in failed");
              }

            } catch (err) {
              alert("Google sign in failed");
            }
          }
        });

        document
          .getElementById("googleLoginBtn")
          .addEventListener("click", function () {
            googleClient.requestAccessToken();
          });

        function validateEmail(value){
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function showError(el, msg){ el.textContent = msg; el.style.display = 'block'; }
        function hideError(el){ el.textContent=''; el.style.display='none'; }

        // ✅ Updated login flow
        form.addEventListener('submit', async function(ev){
          ev.preventDefault();
          hideError(emailError); hideError(pwdError);

          if(!validateEmail(email.value.trim())){ showError(emailError,'Please enter a valid email address.'); return; }
          if(pwd.value.length < 8){ showError(pwdError,'Password must be at least 8 characters.'); return; }

          const payload = {
            email: email.value.trim(),
            password: pwd.value,
            remember: document.getElementById('remember').checked
          };

          const btn = form.querySelector('.btn');
          btn.disabled = true; btn.textContent = 'Signing in...';

          try {
            const res = await fetch('/signin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok && data.success) {
              // ✅ Redirect to home page
              window.location.href = '/home_page';
            } else {
              showError(pwdError, data.message || 'Invalid credentials');
            }
          } catch (err) {
            showError(pwdError, 'Network error. Please try again.');
          } finally {
            btn.disabled = false; btn.textContent = 'Sign in';
          }
        });

        email.addEventListener('input', ()=>{ if(email.value.length && !validateEmail(email.value)) showError(emailError,'Invalid email'); else hideError(emailError); });
        pwd.addEventListener('input', ()=>{ if(pwd.value.length && pwd.value.length < 8) showError(pwdError,'Too short'); else hideError(pwdError); });
      })();
    </script>
  </main>
</body>
</html>
