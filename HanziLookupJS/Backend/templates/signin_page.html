<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='signin_page.css') }}">
</head>
<body>
  <main class="container" aria-labelledby="signin-title">
    <div class="brand">
      <div class="logo" aria-hidden>SI</div>
      <div>
        <h1 id="signin-title">Sign in to your account</h1>
        <p class="lead">Enter your email and password to continue. It's quick and secure.</p>
      </div>
    </div>

    <form id="signinForm" novalidate>
      <div>
        <label for="email">Email</label>
        <input id="email" class="input" name="email" type="email" inputmode="email" placeholder="you@company.com" required aria-required="true">
        <div id="emailError" class="error" aria-live="polite" style="display:none"></div>
      </div>

      <div>
        <label for="password">Password</label>
        <div style="position:relative">
          <input id="password" class="input" name="password" type="password" placeholder="Enter password" minlength="8" required aria-required="true" style="padding-right:96px">
          <button id="togglePwd" type="button" aria-label="Show password" style="position:absolute;right:8px;top:6px;padding:8px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:13px">Show</button>
        </div>
        <div id="pwdError" class="error" aria-live="polite" style="display:none"></div>
      </div>

      <div class="row">
        <label class="checkbox"><input id="remember" type="checkbox"> <span class="small">Remember me</span></label>
        <a href="#" class="small">Forgot password?</a>
      </div>

      <div>
        <button class="btn" type="submit">Sign in</button>
      </div>

      <div class="divider small">Or continue with</div>

        <button type="button" class="social-btn" aria-label="Sign in with Google">Google</button>
