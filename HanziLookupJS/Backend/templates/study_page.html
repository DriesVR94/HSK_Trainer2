<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HanziLookupJS demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='study_page.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>


</head>
<body data-level="{{ level }}">
  <div class="header">
    <h1>HanziLookupJS demo</h1>
    <a href="https://github.com/gugray/HanziLookupJS">github.com/gugray/HanziLookupJS</a>
  </div>

  <div class="content">
    <div class="colLeft_2">
      <div class="targetCharBox">loading…</div>
    </div>

    <!-- dynamic boards go here -->
    <div class="colLeft" id="drawingBoardsContainer"></div>
    <div style="text-align: center; margin: 20px 0;">
      <div class="cmd" id="nextButton" style="width: 200px; margin: 10px auto;"><i class="fa-solid fa-angle-right"></i> </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='lib/jquery-3.1.1.min.js') }}"></script>
  <script src="{{ url_for('static', filename='dist/hanzilookup.min.js') }}"></script>

  <script>

    // Choose between development or production
    const isDev = false; // set to false before deploying

    const START_LEVEL = Number(document.body.dataset.level) || 1;

    // ----- 1.  fetch random HSK character -----
    let hanziLoaded = false, assetsLoaded = false;
    let hanziList = [];

    function loadRandomHanzi() {
      const randomEntry = hanziList[Math.floor(Math.random() * hanziList.length)];
      const displayText = `${randomEntry.english} <br>-<br> <span style="font-style: italic;">${randomEntry.pinyin}</span>
`;

      document.querySelector('.targetCharBox').innerHTML = displayText;

      // Store globally
      window.targetHanziEntry = randomEntry;
      window.targetCharacter = randomEntry.chinese;

      buildBoards();
    }

    // ----- 2.  load HanziLookup data files -----
    let filesToLoad = 2;
    function fileLoaded(ok) {
      if (!ok) { filesToLoad = -1; return; }
      if (--filesToLoad === 0) { assetsLoaded = true; maybeInitBoards(); }
    }

    function loadLevel(level) {
      hanziLoaded = false;
      document.querySelector('.targetCharBox').innerText = "loading…";

      fetch(`/get_vocabulary?level=${level}`)
        .then(r => r.json())
        .then(data => {
          hanziList = data;
          hanziLoaded = true;
          maybeInitBoards();
        })
        .catch(err => {
          console.error(err);
          document.querySelector('.targetCharBox').innerText = "⚠️ load error";
        });
    }

    HanziLookup.init('mmah', "{{ url_for('static', filename='dist/mmah.json') }}", fileLoaded);
    HanziLookup.init('orig', "{{ url_for('static', filename='dist/orig.json') }}", fileLoaded);

    // ----- 3.  create boards when BOTH kinds of data are ready -----
    function maybeInitBoards() { if (hanziLoaded && assetsLoaded) loadRandomHanzi(); }

    function buildBoards() {
      const container = document.getElementById('drawingBoardsContainer');
      container.innerHTML = '';

      const count = 10; // ✅ FIXED NUMBER OF BOARDS
      const columns = 5;

      // 👉 switch layout to grid instead of flex
      container.style.display = 'grid';
      container.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
      container.style.gap = '20px';
      container.style.width = '810px';
      container.style.margin = '0 auto';

      const boxSize = 150; // fixed size works better in grid
      const fontSize = 14;

      window._drawingBoards = [];

      for (let idx = 0; idx < count; idx++) {
        const wrap = document.createElement('div');
        wrap.className = 'boardWrap';

        wrap.innerHTML = `
          <div class="drawingBoard">
            <div class="solutionAnimation"></div>
          </div>

          <div class="commands">
            <div class="cmd cmdRecognize dev-only">Recognize</div>
          </div>

          <h2 class="dev-only" style="font-size: ${fontSize}px;">Original HanziLookup data</h2>
          <div class="charPicker hanziLookupChars dev-only"></div>

          <h2 class="dev-only" style="font-size: ${fontSize}px;">Make Me a Hanzi data</h2>
          <div class="charPicker mmahLookupChars dev-only"></div>

          <h2 class="dev-only" style="font-size: ${fontSize}px;">OCR Result</h2>
          <div class="ocrResultBox dev-only">…</div>
        `;

        container.appendChild(wrap);

        const boardElem = wrap.querySelector('.drawingBoard');
        const resOrig = wrap.querySelector('.hanziLookupChars');
        const resMMAH = wrap.querySelector('.mmahLookupChars');

        const board = HanziLookup.DrawingBoard($(boardElem), () => {
          lookup(board, resOrig, resMMAH);
        });

        const recognizeButton = wrap.querySelector('.cmdRecognize');
        recognizeButton.onclick = () => {
          lookup(board, resOrig, resMMAH);
        };

        window._drawingBoards.push(board);
      }

      // ✅ hide dev elements once (not inside loop)
      if (!isDev) {
        document.querySelectorAll('.dev-only').forEach(el => el.style.display = 'none');
      }
    }

    document.getElementById('nextButton').onclick = () => {
      loadRandomHanzi();
    };

    // ----- 4.  lookup helpers -----
    function lookup(board, elmOrig, elmMMAH) {
      const analysed = new HanziLookup.AnalyzedCharacter(board.cloneStrokes());
      new HanziLookup.Matcher('orig').match(analysed, 5, m => show(elmOrig, m));
      new HanziLookup.Matcher('mmah').match(analysed, 5, m => show(elmMMAH, m));
    }
    function show(elm, matches) {
      elm.innerHTML = matches.map(o => `<span>${o.character}</span>`).join('');
    }

  loadLevel(START_LEVEL);
    
  </script>
</body>
</html>
